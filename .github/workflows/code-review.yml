name: Simple Bot Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: read

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  build_diff:
    runs-on: ubuntu-latest
    outputs:
      comment_body: ${{ steps.build_script.outputs.body }}
      has_body: ${{ steps.build_script.outputs.has_body }}
    steps:
      - name: Local Run Placeholder
        if: ${{ env.ACT == 'true' }}
        run: |
          echo "Local run: Skipping diff generation."

      - uses: actions/checkout@v4
        if: ${{ env.ACT != 'true' }}

      - name: Build diff string
        if: ${{ env.ACT != 'true' }}
        id: build_script
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            if (!prNumber) {
              core.setFailed('Could not get pull request number from context');
              return;
            }
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const changes = files.map(file => {
              const status = file.status === 'modified' ? '🔄' :
                            file.status === 'added' ? '✨' :
                            file.status === 'removed' ? '🗑️' : '📝';
              const patch = file.patch || '新規ファイル';
              return '### ' + status + ' ' + file.filename + '\n' +
                     '```diff\n' +
                     patch + '\n' +
                     '```\n' +
                     '変更行数: ' + file.changes + '行';
            });
            const commentBody = changes.join('\n\n');
            core.setOutput('body', commentBody);
            if (commentBody) {
              core.setOutput('has_body', 'true');
            } else {
              core.setOutput('has_body', 'false');
            }

  post_comment:
    runs-on: ubuntu-latest
    needs: build_diff
    steps:
      - name: Generate GitHub App Token
        if: env.ACT != 'true' && needs.build_diff.outputs.has_body == 'true'
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.REVIEW_GITHUB_APP_ID }}
          private-key: ${{ secrets.REVIEW_GITHUB_APP_PRIVATE_KEY }}

      - name: Post file changes as a comment
        if: env.ACT != 'true' && needs.build_diff.outputs.has_body == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            const body = `${{ needs.build_diff.outputs.comment_body }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
