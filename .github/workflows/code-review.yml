name: Simple Bot Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# 権限の設定を追加
permissions:
  pull-requests: write
  issues: write # Issueへのコメント投稿に必要
  contents: read # actions/create-github-app-token@v1 が必要とする権限

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub App Token
        id: generate_token # このIDでトークンにアクセスします
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.REVIEW_GITHUB_APP_ID }} # シークレットから直接App IDを取得
          private-key: ${{ secrets.REVIEW_GITHUB_APP_PRIVATE_KEY }} # シークレットから直接Private Keyを取得

      - name: Local Run Placeholder
        if: ${{ env.ACT == 'true' }}
        run: |
          echo "Local run: Skipping API calls and comment posting."

      - name: Post file changes as a comment
        if: ${{ env.ACT != 'true' }}
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            const prNumber = context.issue.number;
            if (!prNumber) {
              core.setFailed('Could not get pull request number from context');
              return;
            }
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const changes = files.map(file => {
              const status = file.status === 'modified' ? '🔄' :
                            file.status === 'added' ? '✨' :
                            file.status === 'removed' ? '🗑️' : '📝';
              const patch = file.patch || '新規ファイル';
              return '### ' + status + ' ' + file.filename + '\n' +
                     '```diff\n' +
                     patch + '\n' +
                     '```\n' +
                     '変更行数: ' + file.changes + '行';
            });
            const commentBody = changes.join('\n\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody
            });