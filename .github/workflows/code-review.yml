name: Simple Bot Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# 権限の設定を追加
permissions:
  pull-requests: write
  issues: write # Issueへのコメント投稿に必要
  contents: read # actions/create-github-app-token@v1 が必要とする権限

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install @octokit/rest @actions/github typescript @types/node node-fetch@2 ts-node --save-dev @types/node-fetch

      - name: Generate GitHub App Token
        id: generate_token # このIDでトークンにアクセスします
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.REVIEW_GITHUB_APP_ID }} # シークレットから直接App IDを取得
          private-key: ${{ secrets.REVIEW_GITHUB_APP_PRIVATE_KEY }} # シークレットから直接Private Keyを取得

#      - name: Post review comment
#        run: npx ts-node .github/scripts/review-comment.ts
#        env:
#          GITHUB_APP_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Add PR comment (local)
        if: ${{ env.ACT == 'true' }}
        run: echo "このPRは承認を待っています。."

      - name: Get PR files via GitHub API
        if: ${{ env.ACT != 'true' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const { data: files } = await appGithub.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
          
            // 変更内容の詳細を取得
            // Get detailed changes.
            const changes = await Promise.all(
              files.map(async file => {
                const status = file.status === 'modified' ? '🔄' : 
                              file.status === 'added' ? '✨' : 
                              file.status === 'removed' ? '🗑️' : '📝';
          
                return `
                  ### ${status} ${file.filename}
                  \`\`\`diff
                  ${file.patch || '新規ファイル'}
                  \`\`\`
                  変更行数: ${file.changes}行
                `;
              })
            );
            console.log(changes);

      - name: Add PR comment (GitHub)
        if: ${{ env.ACT != 'true' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'このPRは承認を待っています。'
            })