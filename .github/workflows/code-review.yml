name: Simple Bot Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# 権限の設定を追加
permissions:
  pull-requests: write
  issues: write # Issueへのコメント投稿に必要
  contents: read # actions/create-github-app-token@v1 が必要とする権限

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install @octokit/rest @actions/github @actions/core typescript @types/node node-fetch@2 ts-node --save-dev @types/node-fetch

      - name: Generate GitHub App Token
        id: generate_token # このIDでトークンにアクセスします
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.REVIEW_GITHUB_APP_ID }} # シークレットから直接App IDを取得
          private-key: ${{ secrets.REVIEW_GITHUB_APP_PRIVATE_KEY }} # シークレットから直接Private Keyを取得

      - name: Local Run Placeholder
        if: ${{ env.ACT == 'true' }}
        run: |
          echo "Local run: Skipping API calls and comment posting."

      - name: Get PR files via GitHub API
        if: ${{ env.ACT != 'true' }}
        id: file_changes
        run: node .github/scripts/sample.mjs
        env:
          TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Post Changes to PR
        if: ${{ env.ACT != 'true' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            const body = `${{ steps.file_changes.outputs.comment_body }}`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });